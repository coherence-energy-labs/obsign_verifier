[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# `obsign-verify` — VERIFIED AVAILABLE on PyPI 2026-08-01, and deliberately not `obsign`.
#
# The bare `obsign` name is HELD BY SOMEONE ELSE: PyPI 0.0.1 "Reserved for the Obsign
# project — cryptographic proof of AI agent actions", pointing at github.com/obsign, an
# org created 2026-07-30 16:57Z with the PyPI name reserved 17 minutes later. Verified
# not ours by the §0.5 test — this account is a member of coherence-energy-labs only.
#
# This package is the VERIFIER, not the engine, so the longer name is the accurate one
# regardless: it says what you install and what it does.
name = "obsign-verify"
version = "0.1.2"
description = "Re-derive an Obsign receipt's claim on your own machine, offline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Coherence Energy Labs" }]
keywords = ["provenance", "receipts", "verification", "determinism", "reproducibility"]

# numpy only. A verifier a stranger is asked to trust should be auditable in an
# afternoon, and every dependency is something else they have to trust.
dependencies = ["numpy>=1.24"]

# 0.1.0 shipped with NO urls table at all, so the PyPI page had zero links: a stranger
# who landed there could not reach us, read the spec, or report a break. For a product
# whose next gate is "one logged stranger attestation", that was a direct blocker --
# the artifact invited scrutiny and then gave it nowhere to go.
#
# Every URL below returned 200 when this table was written -- `Source` and `Issues`
# checked ANONYMOUSLY, without a token, because "reachable by me" and "reachable by a
# stranger" are different claims and only the second one matters here.
#
# 0.1.1 shipped without Source/Issues on purpose: the repository was private, and a
# dead link on a provenance tool's own page costs more credibility than a missing one.
# It went public 2026-08-01 once the credential in its history was ROTATED -- not when
# the history was rewritten. Force-push does not unpublish; GitHub still serves
# orphaned objects by SHA, so publishing the repo before rotation would have handed
# out a working key.
#
# THIS TABLE MUST STAY BELOW EVERY BARE `project` KEY. TOML tables run until the next
# header, so putting it directly after `keywords` silently captured `dependencies` as
# `project.urls.dependencies` -- caught only because the build refused. Editing the file
# is not the check; building the artifact is.
[project.urls]
Homepage = "https://obsign.io"
Documentation = "https://obsign.io/docs/"
"Verify a receipt" = "https://obsign.io/verify/"
"Report a break" = "https://obsign.io/security/"
Changelog = "https://obsign.io/changelog/"
Source = "https://github.com/coherence-energy-labs/obsign_verifier"
Issues = "https://github.com/coherence-energy-labs/obsign_verifier/issues"

[project.optional-dependencies]
# Signature checking is optional BY DESIGN. Integrity and re-derivation -- the two
# steps that make this more than attestation -- need no crypto library at all, so a
# stranger can verify the number with numpy and nothing else.
sig = ["cryptography>=41"]
dev = ["pytest>=7", "cryptography>=41"]

[project.scripts]
obsign-verify = "obsign_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vectors and the challenge bundles are PACKAGE DATA, not repo files. A
# `pip install` must give a stranger everything the README tells them to run --
# the first cut of this file shipped neither, so both documented commands failed
# for anyone who installed instead of cloning. ~64 KB, and it is the whole point
# of the product: hand the sceptic the forgeries in the same breath as the tool.
obsign_verify = ["py.typed", "data/*.json", "data/challenge/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
