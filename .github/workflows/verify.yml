name: verify

# THE CLAIM THIS WORKFLOW EXISTS TO BACK
#
# The README says the number re-derives to identical bits on the reader's hardware, and
# states one honest residual risk: a source value sitting exactly on a .5 rounding
# boundary could round differently under a different libm -- "not observed across the
# platforms tested; not proven impossible."
#
# When that sentence was written, ONE platform had been tested. "Not observed across the
# platforms tested" was true and nearly empty, which is the kind of true-and-empty
# sentence this estate keeps finding and killing.
#
# This runs the conformance vectors on x86_64 Linux, ARM64 macOS and Windows, across
# four Python versions. The architecture split is the load-bearing part: aarch64 and
# x86_64 have different libm implementations, and if the .5-boundary risk were going to
# bite, that is where it would.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossplatform:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        # macos-14 is Apple silicon: ARM64, a genuinely different libm from the
        # x86_64 runners. Without it this matrix would be three flavours of one
        # architecture and would prove far less than it appears to.
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Test suite
        run: python -m pytest -q

      - name: Report the architecture actually being tested
        shell: python
        run: |
          import platform, sys
          print(f"machine={platform.machine()}  system={platform.system()}  "
                f"python={sys.version.split()[0]}")

      # The load-bearing step. Not "the tests passed" -- the actual output hashes,
      # printed, so a divergence between two runners is visible in the log rather than
      # only in a red X. If these ever differ across the matrix, that IS the finding.
      - name: Conformance vectors must reproduce bit-for-bit
        shell: python
        run: |
          import json, platform, sys
          from obsign_verify import data_path
          from obsign_verify.kernel import array_sha256, build_fixed_inputs, evolve

          # data_path(), NOT a repo-relative path. The vectors and bundles moved INSIDE
          # the package so a `pip install` gives a stranger everything the README tells
          # them to run -- this file kept reading `vectors/...` afterwards and every
          # matrix job died with FileNotFoundError. Reading the installed package is
          # also the stricter check: it tests what ships, not what happens to be in the
          # working directory.
          cases = json.loads(data_path("conformance_vectors.json")
                             .read_text(encoding="utf-8"))
          assert cases, "no conformance vectors -- this check would be vacuous"

          bad = 0
          print(f"--- {platform.machine()} / {platform.system()} ---")
          for c in cases:
              got = array_sha256(evolve(build_fixed_inputs(c["params"])))
              ok = got == c["output_sha256"]
              bad += not ok
              print(f"  {'ok  ' if ok else 'DIFF'} {c['name']:<18} {got}")
          if bad:
              sys.exit(f"{bad} vector(s) diverged on this platform -- this is the "
                       f"residual libm risk the README names, and it is now OBSERVED")
          print(f"all {len(cases)} vectors bit-identical here")

      - name: The shipped forgeries must still be refused
        shell: python
        run: |
          import sys
          from obsign_verify import data_path, load_receipt, verify

          bundles = sorted(data_path("challenge", "bundles").glob("*/receipt.json"))
          assert len(bundles) >= 9, f"only {len(bundles)} bundle(s) -- check would be vacuous"
          wrong = []
          for p in bundles:
              r = load_receipt(p.read_text(encoding="utf-8"))
              want = r.get("_challenge", {}).get("expect_verified")
              got = verify(r)["verified"]
              if got is not want:
                  wrong.append(f"{p.parent.name}: expected {want}, got {got}")
          if wrong:
              sys.exit("verdict mismatch on this platform:\n  " + "\n  ".join(wrong))
          print(f"all {len(bundles)} bundles got their declared verdict")

      # THE BOUNDARY-CROSSING CHECK. Its absence is the whole reason a three-release
      # signature break shipped: the producer prefixed a domain tag to the signed
      # message, this verifier signed the bare hash, and every genuine v2 receipt
      # reported InvalidSignature in the tool customers are told to run. Both test
      # suites stayed green because each one signed AND verified with itself.
      #
      # These receipts were signed by the producer. Nothing in this repository made
      # them. If this step goes red, the two implementations have diverged and at
      # least one of them is lying about a signature.
      - name: A receipt the PRODUCER signed must verify here
        shell: python
        run: |
          import sys
          from obsign_verify import data_path, load_receipt, verify

          corpus = sorted(data_path("conformance").glob("*.json"))
          assert len(corpus) >= 3, f"only {len(corpus)} conformance receipt(s) -- vacuous"

          bad = []
          for p in corpus:
              res = verify(load_receipt(p.read_text(encoding="utf-8")))
              sig = res["signature"]
              print(f"  {p.name}")
              print(f"      integrity={res['integrity']} reproduced={res['reproduced']} "
                    f"sig.valid={sig['valid']} identity_bound={sig['identity_bound']}")
              print(f"      signer={sig['attributed_signer']!r} bound={sig['bound_metadata']} "
                    f"unbound={sig['unbound_metadata']}")
              if not (sig["present"] and sig["valid"] and sig["identity_bound"]):
                  bad.append(f"{p.name}: {sig['detail']}")
          if bad:
              sys.exit("this verifier REFUSES a receipt the producer signed:\n  "
                       + "\n  ".join(bad))
          print(f"all {len(corpus)} producer-signed receipt(s) accepted, signer bound")

      # A fix nobody has watched block the original attack is unverified. This builds
      # the forgeries in the job and requires a refusal for each.
      - name: The signature forgeries must be refused
        shell: python
        run: |
          import copy, json, sys
          from obsign_verify import data_path, load_receipt, verify

          base = json.loads(data_path("conformance", "producer_signed_replay.json")
                            .read_text(encoding="utf-8"))
          assert verify(load_receipt(json.dumps(base)))["verified"], \
              "the honest receipt must pass, or every refusal below is meaningless"

          def forge(name, fn):
              r = copy.deepcopy(base)
              fn(r)
              return name, verify(load_receipt(json.dumps(r)))

          FBI = "Dr. J. Smith, FBI Digital Forensics"
          cases = [
              forge("binds key deleted + examiner rewritten",
                    lambda r: (r["signature"].pop("binds"),
                               r["case"].__setitem__("examiner", FBI))),
              forge("binds emptied + examiner rewritten",
                    lambda r: (r["signature"].__setitem__("binds", []),
                               r["case"].__setitem__("examiner", FBI))),
              forge("bound case tampered",
                    lambda r: r["case"].__setitem__("examiner", FBI)),
              forge("signer rewritten",
                    lambda r: r["signature"].__setitem__("signer", FBI)),
              forge("signature from another key",
                    lambda r: r["signature"].__setitem__("public_key", "00" * 32)),
              forge("signature over another body",
                    lambda r: r["signature"].__setitem__("sig", "ab" * 64)),
          ]
          leaked = []
          for name, res in cases:
              sig = res["signature"]
              ok = (not sig["valid"]) and (not res["verified"]) \
                  and sig["attributed_signer"] is None
              print(f"  {'refused' if ok else 'ACCEPTED'}  {name}")
              if not ok:
                  leaked.append(name)
          if leaked:
              sys.exit("FORGERY ACCEPTED by the verifier: " + "; ".join(leaked))
          print(f"all {len(cases)} forgeries refused, and none attributed a signer")

      - name: The published stream must re-derive here
        run: python tools/dogfood.py --check

      # The replay path is the product claim, so it is exercised on every platform in
      # the matrix rather than trusted from one. Regenerating the receipt here also
      # proves the EXAMPLE still runs -- a committed receipt that no longer rebuilds
      # would keep passing every test that only reads it.
      - name: A regulated number must re-derive on this platform
        run: |
          python examples/ecl_portfolio.py
          obsign-verify examples/ecl_receipt.json

      - name: The approved program must be pinnable, and a swap must be refused
        shell: python
        run: |
          import json, sys
          from obsign_verify.cli import main
          d = json.load(open("examples/ecl_receipt.json", encoding="utf-8"))
          approved = d["params"]["program_sha256"]
          assert main(["examples/ecl_receipt.json", "--expect-program", approved,
                       "--quiet"]) == 0, "the approved program should verify"
          assert main(["examples/ecl_receipt.json", "--expect-program", "0" * 64,
                       "--quiet"]) == 1, "a different program MUST be refused"
          print(f"program pinning holds both ways ({approved[:16]}..)")

      - name: The CLI must work as documented
        run: |
          obsign-verify --version
          obsign-verify --self-check

  # The JavaScript port's tests ran ONLY in release.yml, so a defect in it lived until
  # someone cut a release. That is how `verified` shipped without the signature in its
  # conjunction: an invalid signature printed VERIFIED and exited 0, and no push-time
  # job ever executed the port at all.
  rust:
    name: rust third implementation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A THIRD READING, ACTUALLY RUN. The Rust crate exists to catch the
      # ambiguities two same-ecosystem implementations share, and on both
      # Python-against-JavaScript splits found so far it was the tie-breaker that
      # turned "two implementations differ" into "one is the outlier". It was
      # invisible to this pipeline, which means it would have rotted: the
      # differential skips its column when the binary is absent, and a skip reads
      # like a pass in every summary line.
      - name: Build the crate
        working-directory: rust
        run: cargo build --release --locked

      - name: Crate tests
        working-directory: rust
        run: cargo test --release --locked

      - name: Install this package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # OBSIGN_REQUIRE=rust makes a missing binary a FAILURE rather than a skip,
      # so this job cannot go green by not running the thing it exists to run.
      - name: Three-way differential, rust leg mandatory
        env:
          OBSIGN_REQUIRE: "rust,node"
        run: python -m pytest tests/test_cross_language_differential.py tests/test_receipt_byte_differential.py -q

  javascript:
    name: javascript port · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]      # 18 is the floor `engines` declares
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test suite
        working-directory: js
        run: npm test

      # The exit code IS the interface. A note in stdout saying "not checked" is
      # documentation; a pipeline reads `$?`. This asserts the status directly.
      - name: A forged signature must produce a FAILING exit code
        working-directory: js
        run: |
          set -eu
          GOOD=../src/obsign_verify/data/conformance/producer_signed_replay.json
          node bin/obsign-verify.js "$GOOD"
          echo "--- now the same receipt with the signature replaced by nonsense ---"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            r.signature.sig = "ab".repeat(64);
            fs.writeFileSync("forged.json", JSON.stringify(r, null, 1));
          ' "$GOOD"
          if node bin/obsign-verify.js forged.json; then
            echo "FAIL: a forged signature exited 0 -- the signature is not gating the verdict"
            exit 1
          fi
          echo "--- and with the binds list stripped and the examiner rewritten ---"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            delete r.signature.binds;
            r.case.examiner = "Dr. J. Smith, FBI Digital Forensics";
            fs.writeFileSync("stripped.json", JSON.stringify(r, null, 1));
          ' "$GOOD"
          if node bin/obsign-verify.js stripped.json; then
            echo "FAIL: stripping binds exited 0 -- the bound-metadata check is being skipped"
            exit 1
          fi
          rm -f forged.json stripped.json
          echo "both forgeries exited non-zero"

  gates:
    name: doc gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # FULL history. The commit-message scan below is meaningless at depth 1 --
          # it would read the tip and report on the repository.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # EVERY ACTION IS A COMMIT, AND NOTHING FLOATS TO `latest`.
      #
      # `release.yml` pinned every `uses:` to a 40-hex SHA except one: the PyPI publish
      # action, on the mutable `@release/v1` branch -- inside the ONLY job that holds
      # `id-token: write`. Whoever can move that branch gets code execution in a context
      # that mints a PyPI credential scoped to this repository, on the next tag we push,
      # with nothing in this repository changing. The same job's npm sibling ran
      # `npm install -g npm@latest` in the step immediately before
      # `npm publish --provenance`, so the code that used an npm credential was whatever
      # the registry served at that second.
      #
      # Both are fixed. This step is what stops them coming back, because a pin restored
      # by hand is a pin that gets un-restored by hand. It runs in `gates`, on every push
      # and every pull request, so a floating ref is caught before a release exists --
      # `release.yml` only runs on a tag, which is far too late to learn this.
      #
      # THE CHECK IS ASSERTED IN BOTH DIRECTIONS. A grep for bad shapes that finds
      # nothing is indistinguishable from a grep that ran against no files at all, so it
      # also asserts that it FOUND workflows, that they contained `uses:` lines, and
      # that it recognised the two credential-holding jobs. A vacuous gate is a dark one.
      - name: Every action pinned to a commit; nothing floats to latest
        shell: python
        run: |
          import pathlib, re, sys

          wf = sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          assert wf, "no workflows found -- this check would be vacuous"

          SHA = re.compile(r"^[0-9a-f]{40}$")
          # `uses:` values that name a local path or a container are not pinnable by SHA.
          LOCAL = ("./", "docker://")
          # Assembled rather than written out, because this file is one of the files
          # being scanned: spelling the token literally here makes the detector match
          # its own source and fail on a clean repository. A check that cannot PASS is
          # as dark as one that cannot fail.
          FLOATING = "@" + "latest"

          uses_seen = 0
          bad = []
          for path in wf:
              for n, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  stripped = line.strip()

                  m = re.match(r"^-?\s*uses:\s*(\S+)", stripped)
                  if m:
                      ref = m.group(1).strip("'\"")
                      if ref.startswith(LOCAL):
                          continue
                      uses_seen += 1
                      if "@" not in ref or not SHA.match(ref.rsplit("@", 1)[1]):
                          bad.append(f"{path}:{n}: `uses: {ref}` is not pinned to a "
                                     f"40-hex commit SHA")

                  # A floating tag anywhere in an executed line -- an npm global
                  # install, a pip install, an action ref. Checked on every line rather
                  # than only on `run:` headers, because a `run: |` block's BODY is
                  # where it actually appeared.
                  if FLOATING in stripped and not stripped.startswith("#"):
                      bad.append(f"{path}:{n}: resolves a dependency at run time "
                                 f"('{FLOATING}') -- pin the version")

          assert uses_seen >= 10, (
              f"only {uses_seen} `uses:` line(s) inspected across {len(wf)} workflow(s) "
              f"-- the scan is not reading what it claims to")

          # The two jobs that hold a publishing credential must still exist and must
          # still be the ones this check is about. If they are renamed away, the check
          # above keeps passing while guarding nothing.
          # COMMENTS ARE NOT EVIDENCE. Searched over EXECUTED lines only: this file's
          # own prose names `npm publish --provenance`, and so does release.yml's, so a
          # whole-text search stayed satisfied after the flag was deleted from the
          # command -- a guard held up by the sentence describing it.
          release = [ln.strip() for ln
                     in pathlib.Path(".github/workflows/release.yml")
                     .read_text(encoding="utf-8").splitlines()
                     if ln.strip() and not ln.strip().startswith("#")]
          for needle in ("id-token: write", "pypa/gh-action-pypi-publish@",
                         "npm publish --provenance"):
              assert any(needle in ln for ln in release), (
                  f"release.yml no longer runs {needle!r} -- this gate is guarding "
                  f"a workflow that has moved, which is the same as guarding nothing")

          # And the Rust toolchain, the last unpinned input to the third implementation.
          tc = pathlib.Path("rust-toolchain.toml")
          assert tc.is_file(), "rust-toolchain.toml is missing -- the compiler is unpinned"
          channel = re.search(r'(?m)^channel\s*=\s*"([^"]+)"',
                              tc.read_text(encoding="utf-8"))
          assert channel and re.fullmatch(r"\d+\.\d+(\.\d+)?", channel.group(1)), (
              "rust-toolchain.toml must pin an exact version, not a moving channel "
              "like 'stable' or 'nightly'")

          # THE BUILD TOOLCHAIN IS A DEPENDENCY TOO. `build` and `twine` PRODUCE and
          # inspect the artifact this repository publishes under its own name, and they
          # were installed unversioned -- so the bytes a stranger downloads depended on
          # whatever the index served at that moment. Only the packages named here are
          # required to carry `==`: `pip install -e ".[dev]"` is the repository itself
          # and is pinned by `pyproject.toml`, not by a command line.
          MUST_PIN = ("build", "twine")
          INSTALL = "pip" + " install"      # assembled: this file is scanned by itself
          pinned_seen = 0
          for path in wf:
              for n, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  s = line.strip()
                  if s.startswith("#") or INSTALL not in s:
                      continue
                  for name, version in re.findall(
                          r"(?<![\w./\"'-])([A-Za-z][A-Za-z0-9_.-]*)"
                          r"(==[^\s\"']+)?(?=\s|$)", s):
                      if name not in MUST_PIN:
                          continue
                      if version:
                          pinned_seen += 1
                      else:
                          bad.append(f"{path}:{n}: `{name}` is installed without an "
                                     f"exact `==` version")

          # If the release workflow stops installing them at all this check has nothing
          # left to guard, and would go green by finding nothing.
          assert pinned_seen + len(bad) >= len(MUST_PIN), (
              f"no pinned build tool found in any workflow (looked for "
              f"{', '.join(MUST_PIN)}) -- this half of the gate is dark")

          if bad:
              sys.exit("unpinned dependencies in CI:\n  " + "\n  ".join(bad))
          print(f"{uses_seen} action reference(s) across {len(wf)} workflow(s) pinned to "
                f"commit SHAs; no floating tags; {'/'.join(MUST_PIN)} pinned; "
                f"rust toolchain {channel.group(1)}")

      # A live ANTHROPIC_API_KEY reached this repository's history on 2026-08-01, inside
      # a commit MESSAGE -- spliced there by backtick command substitution in an unquoted
      # bash heredoc. Every file-based scanner walked past it, because no file was ever
      # wrong. This reads what GitHub actually stores and serves.
      #
      # The self-test runs FIRST and is not optional: a detector that has never been
      # shown a positive proves nothing by staying green.
      - name: No credential may live in a commit message
        run: |
          python tools/check_commit_messages.py --self-test
          python tools/check_commit_messages.py

      - name: The GRC mapping must match its document
        run: |
          python tools/compliance_map.py --self-test
          python tools/compliance_map.py

      - name: Byte-pinned artifacts must contain no CRLF
        shell: python
        run: |
          import pathlib, sys
          from obsign_verify import data_path
          # Two byte-pins in this estate were broken by line-ending conversion in a
          # single day. The receipts here are robust by design, but being wrong about
          # WHICH kind of robustness you have is the part that costs credibility.
          #
          # `challenge/bundles` and `vectors` moved INSIDE the package. This check kept
          # globbing the old repo paths, which matched nothing -- and `assert pinned`
          # still PASSED, because stream/ alone is non-empty. It silently checked 5
          # files while reporting on all of them. Assert the COUNT, never just
          # non-emptiness: a partially-vacuous check reads exactly like a whole one.
          crlf = bytes([13, 10])
          groups = {
              "stream": list(pathlib.Path("stream").glob("*.json")),
              "bundles": list(data_path("challenge", "bundles").glob("*/receipt.json")),
              "vectors": [data_path("conformance_vectors.json")],
              "conformance": list(data_path("conformance").glob("*.json")),
          }
          for name, files in groups.items():
              assert files, f"'{name}' matched NOTHING -- this check would be vacuous"
          assert len(groups["bundles"]) >= 9, f"only {len(groups['bundles'])} bundle(s)"
          assert len(groups["conformance"]) >= 3, \
              f"only {len(groups['conformance'])} conformance receipt(s)"
          pinned = [p for fs in groups.values() for p in fs]
          bad = [str(p) for p in pinned if crlf in p.read_bytes()]
          if bad:
              sys.exit(f"CRLF in byte-pinned artifacts: {bad}")
          print(f"{len(pinned)} pinned artifact(s) across "
                f"{ {k: len(v) for k, v in groups.items()} }, no CRLF")
